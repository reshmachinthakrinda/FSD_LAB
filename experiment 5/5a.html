<!DOCTYPE html>
<html>
<head>
    <title>CSS Color References</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        h1 {
            color: #333333;
        }

        .box {
            width: 300px;
            margin: 15px auto;
            padding: 15px;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        .name {
            background-color: lightcoral;
            color: white;
        }

        .hex {
            background-color: #3498db;
            color: white;
        }

        .rgb {
            background-color: rgb(46, 204, 113);
            color: white;
        }

        .hsl {
            background-color: hsl(280, 70%, 60%);
            color: white;
        }
    </style>
</head>

<body>

    <h1>CSS Color References</h1>

    <div class="box name">Color Name</div>

    <div class="box hex">HEX Color</div>

    <div class="box rgb">RGB Color</div>

    <div class="box hsl">HSL Color</div>

</body>
</html>
