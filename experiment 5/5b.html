
<!DOCTYPE html>
<html>

<head>
    <title>Fixed Background Image</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
            background-image: url("../images/backgroundimage.jpg");
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
        }

        .content {
            width: 70%;
            margin: 100px auto;
            padding: 30px;
            background-color: white;
            text-align: center;
            border-radius: 15px;
        }

        h1 {
            color: #333;
        }

        p {
            font-size: 18px;
            line-height: 2;
        }

    </style>
</head>

<body>

    <div class="content">

        <h1>Fixed Background Image</h1>

        <p>
            This page demonstrates a fixed background image.
        </p>

        <p>
            Scroll the page up and down.
            The background image remains fixed.
        </p>

        <br><br><br><br><br><br>

        <h2>Keep Scrolling...</h2>

        <br><br><br><br><br><br>

        <p>
            The background image is still fixed!
        </p>

    </div>

</body>

</html>
