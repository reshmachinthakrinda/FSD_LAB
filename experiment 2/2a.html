<!DOCTYPE html>
<html>
<head>
    <title>HTML Tables</title>

    <style>
        body {
            background-color: #FFF8F2;
            font-family: Arial, sans-serif;
        }

        h2 {
            color: #6A5ACD;
        }

        table {
            background-color: #FFFFFF;
            border-collapse: collapse;
        }

        th {
            background-color: #D8EAFD;
            color: #333333;
        }

        td {
            background-color: #FCE8E6;
            text-align: center;
        }
    </style>

</head>

<body>

    <h2 align="center">Student Details Table</h2>

    <table border="2" cellpadding="10" cellspacing="5" align="center">

        <tr>
            <th rowspan="2">Roll No</th>
            <th rowspan="2">Name</th>
            <th colspan="3">Marks</th>
        </tr>

        <tr>
            <th>HTML</th>
            <th>CSS</th>
            <th>JavaScript</th>
        </tr>

        <tr>
            <td>101</td>
            <td>Asha</td>
            <td>85</td>
            <td>90</td>
            <td>88</td>
        </tr>

        <tr>
            <td>102</td>
            <td>Rahul</td>
            <td>78</td>
            <td>82</td>
            <td>80</td>
        </tr>

        <tr>
            <td>103</td>
            <td>Sneha</td>
            <td>92</td>
            <td>95</td>
            <td>93</td>
        </tr>

    </table>

</body>
</html>
