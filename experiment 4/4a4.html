<!DOCTYPE html>
<html>
<head>
    <title>Pseudo-Element Selector</title>

    <style>
        body{
            font-family: Arial;
            background-color: #FAF8F5;
            padding: 20px;
        }

        p::first-letter{
            color: #7C8A9A;
            font-size: 30px;
            font-weight: bold;
        }

        p::first-line{
            color: #56735B;
            font-weight: bold;
        }
    </style>

</head>

<body>

<h2>Pseudo-Element Selector</h2>

<p>
HTML and CSS are used to create attractive webpages.
Pseudo-elements allow styling specific parts of an element,
such as the first letter or first line.
</p>

</body>
</html>
