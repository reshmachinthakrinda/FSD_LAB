<!DOCTYPE html>
<html>
<head>
    <title>Simple Selectors</title>

    <style>
        /* Universal Selector */
        *{
            font-family: Arial;
            background-color: #FAF8F5;
        }

        /* Element Selector */
        h1{
            color: #6B7280;
            text-align: center;
        }

        /* ID Selector */
        #heading{
            color: #7C8A9A;
        }

        /* Class Selector */
        .box{
            background-color: #E8F3EC;
            color: #56735B;
            padding: 10px;
            border-radius: 8px;
        }

        /* Group Selector */
        h2,p{
            color: #5F6F65;
        }
    </style>

</head>

<body>

<h1>Simple CSS Selectors</h1>

<h2>Element Selector Example</h2>

<p>This paragraph uses the group selector.</p>

<h2 id="heading">ID Selector Example</h2>

<div class="box">
    This box is styled using a Class Selector.
</div>

</body>
</html>
