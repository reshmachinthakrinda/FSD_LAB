<!DOCTYPE html>
<html>
<head>
    <title>Pseudo-Class Selector</title>

    <style>
        body{
            font-family: Arial;
            background-color: #FAF8F5;
            text-align: center;
        }

        a{
            color: #5B6C8F;
            text-decoration: none;
            font-size: 20px;
        }

        a:hover{
            color: #8B6F6F;
            text-decoration: underline;
        }

        input{
            padding: 8px;
        }

        input:focus{
            background-color: #EAF4EF;
        }

        button:hover{
            background-color: #D8E3E7;
        }
    </style>

</head>

<body>

<h2>Pseudo-Class Selector</h2>

<a href="#">Move Mouse Here</a>

<br><br>

<input type="text" placeholder="Enter Your Name">

<br><br>

<button>Submit</button>

</body>
</html>
