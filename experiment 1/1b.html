
<!DOCTYPE html>
<html>
<head>
    <title>Hyperlinks</title>
</head>

<body>

    <h1>HTML Hyperlinks</h1>

    <h2>Using Anchor Tag</h2>

    <!-- Opens in the same window -->
    <a href="https://www.google.com">
        Visit Google
    </a>

    <br><br>

    <!-- Opens in a new tab -->
    <a href="https://www.youtube.com" target="_blank">
        Visit YouTube
    </a>

    <br><br>
    <!-- Opens in the same window using target -->
    <a href="https://www.github.com" target="_self">
        Visit GitHub
    </a>
</body>
</html>
