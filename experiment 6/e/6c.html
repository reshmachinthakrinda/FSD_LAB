<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Input Methods</title>

    <style>
        body{
            font-family: Arial;
            background-color: #FAF8F5;
            text-align: center;
            padding: 20px;
        }

        input{
            padding: 8px;
            margin: 10px;
        }

        button{
            background-color: #E5F0E8;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        #result{
            margin-top: 20px;
            color: #5F6F65;
            font-size: 18px;
        }
    </style>

    <script>
        function getInput(){

            let name = document.getElementById("name").value;

            let city = prompt("Enter Your City:");

            document.getElementById("result").innerHTML =
            "Name : " + name + "<br>City : " + city;
        }
    </script>

</head>

<body>

<h2>Different Ways for Taking Input</h2>

<input type="text" id="name" placeholder="Enter Your Name">

<br>

<button onclick="getInput()">Submit</button>

<p id="result"></p>

</body>
</html>
