<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Output Methods</title>

    <style>
        body{
            font-family: Arial;
            background-color: #FAF8F5;
            text-align: center;
            padding: 20px;
        }

        button{
            background-color: #D8E3E7;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        #result{
            margin-top: 20px;
            color: #5F6F65;
            font-size: 18px;
        }
    </style>

    <script>
        function showOutput(){

            alert("Output using Alert.");

            console.log("Output using Console.");

            document.getElementById("result").innerHTML =
            "Output using innerHTML.";

        }
    </script>

</head>

<body>

<h2>Different Ways for Displaying Output</h2>

<button onclick="showOutput()">Show Output</button>

<p id="result"></p>

</body>
</html>
